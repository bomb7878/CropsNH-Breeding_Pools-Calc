<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="styles.css">
        <title>CropsNH Breeding Pools Calc</title>
    </head>
    <body>
        <nav class="navbar custom-navbar">
            <div class="container-fluid d-flex justify-content-between align-items-center">
                <div class="nav-links-wrapper">
                    <button id="lang-toggle" class="lang-btn">RU</button>
                    <a href="https://github.com/bomb7878" target="_blank" rel="noopener noreferrer" class="github-link" aria-label="Мой профиль GitHub">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                        </svg>
                        <span class="nav-text" data-i18n="navProfile">Профиль</span>
                    </a>
                    <a href="https://github.com/bomb7878/CropsNH-Breeding_Pools-Calc" target="_blank" rel="noopener noreferrer" class="repo-link">
                        <span class="nav-text" data-i18n="navSource">Исходный код</span>
                    </a>
                </div>
            </div>
        </nav>
        <main class="page">
            <header class="page-header">
            <h1 class="page-title">CropsNH<span>Breeding Pools Calc</span></h1>
            </header>

            <!-- ===== Input card ===== -->
            <section class="card">
            <h2 class="card-title">Breeding combination</h2>
            <p class="card-hint">Enter the names of two plants to see what they produce in the breeding pool.</p>

            <div class="field-row">
                <div class="field">
                <label for="plant-a">Plant A</label>
                <input id="plant-a" list="plant-list" type="text" autocomplete="off" placeholder="e.g. Wheat">
                </div>

                <div class="cross" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <g transform="rotate(-90 12 12)">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <polyline points="19 12 12 19 5 12"></polyline>
                        </g>
                    </svg>
                </div>

                <div class="field">
                <label for="plant-b">Plant B</label>
                <input id="plant-b" list="plant-list" type="text" autocomplete="off" placeholder="e.g. Carrot">
                </div>
            </div>

            <div class="actions">
                <button class="btn-primary" id="calc-btn" type="button">Calculate</button>
                <button class="btn-ghost" id="clear-btn" type="button">Clear</button>
            </div>

            <datalist id="plant-list"></datalist>
            </section>

            <!-- ===== Result card ===== -->
            <section class="card result-card hidden" id="result-card" aria-live="polite">
            <h2 class="card-title">Result</h2>
            <div id="result-body"></div>
            </section>
        </main>
        <script type="module" src="scripts/script.js"></script>
        <script type="module" src="scripts/lang_change.js"></script>
    </body>
</html>
